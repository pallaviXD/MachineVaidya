<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090B0D"/>
      <stop offset="60%" stop-color="#0F1418"/>
      <stop offset="100%" stop-color="#141B20"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="motorBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26333D"/>
      <stop offset="50%" stop-color="#192229"/>
      <stop offset="100%" stop-color="#0F151A"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E272E"/>
      <stop offset="100%" stop-color="#0D1216"/>
    </linearGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="520" rx="16" fill="url(#heroBg)" stroke="#1F2933" stroke-width="2"/>

  <!-- Subtle industrial grid -->
  <g opacity="0.05" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="65" x2="1280" y2="65"/>
    <line x1="0" y1="130" x2="1280" y2="130"/>
    <line x1="0" y1="195" x2="1280" y2="195"/>
    <line x1="0" y1="260" x2="1280" y2="260"/>
    <line x1="0" y1="325" x2="1280" y2="325"/>
    <line x1="0" y1="390" x2="1280" y2="390"/>
    <line x1="0" y1="455" x2="1280" y2="455"/>
    <line x1="160" y1="0" x2="160" y2="520"/>
    <line x1="320" y1="0" x2="320" y2="520"/>
    <line x1="480" y1="0" x2="480" y2="520"/>
    <line x1="640" y1="0" x2="640" y2="520"/>
    <line x1="800" y1="0" x2="800" y2="520"/>
    <line x1="960" y1="0" x2="960" y2="520"/>
    <line x1="1120" y1="0" x2="1120" y2="520"/>
  </g>

  <!-- Top Pill -->
  <g transform="translate(60, 50)">
    <rect width="320" height="28" rx="14" fill="#141B20" stroke="#334155"/>
    <circle cx="16" cy="14" r="5" fill="#F59E0B"/>
    <text x="32" y="18" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">OFFLINE MACHINE INTELLIGENCE</text>
  </g>

  <!-- Title & Pulse -->
  <text x="60" y="135" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Machine<tspan fill="#F59E0B">Vaidya</tspan></text>
  
  <!-- Glowing waveform next to title -->
  <path d="M 450 118 L 475 118 L 485 95 L 495 140 L 505 105 L 515 130 L 525 118 L 560 118" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#waveGlow)"/>

  <!-- Tagline -->
  <text x="60" y="180" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Machines don’t fail without warning. The warning just goes unnoticed.</text>

  <!-- Subtitle Paragraph -->
  <text x="60" y="218" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">An affordable, non-invasive edge sensor system designed for small factories, powerlooms,</text>
  <text x="60" y="240" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">flour mills and pump operators. Learns individual machine baselines and detects anomalies</text>
  <text x="60" y="262" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">without requiring labelled failure datasets or recurring cloud subscriptions.</text>

  <!-- Feature Pills -->
  <g transform="translate(60, 305)">
    <rect x="0" y="0" width="160" height="34" rx="6" fill="#11161A" stroke="#26333D"/>
    <text x="14" y="22" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">⚙ ESP32 Edge DSP</text>

    <rect x="175" y="0" width="185" height="34" rx="6" fill="#11161A" stroke="#26333D"/>
    <text x="14" y="22" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600" transform="translate(175,0)">🔍 Unsupervised iForest</text>

    <rect x="375" y="0" width="175" height="34" rx="6" fill="#11161A" stroke="#26333D"/>
    <text x="14" y="22" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600" transform="translate(375,0)">🔊 Kannada &amp; Hindi TTS</text>
  </g>

  <!-- Hackathon Meta Footer -->
  <g transform="translate(60, 375)">
    <line x1="0" y1="0" x2="550" y2="0" stroke="#1E293B"/>
    <text x="0" y="25" fill="#64748B" font-family="sans-serif" font-size="12">Tech4Bharat Hackathon · Theme: Industrial Manufacturing</text>
    <text x="0" y="45" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="600">Problem Statement 4.3: Small factories lose production to unseen breakdowns</text>
  </g>

  <!-- Status Badge -->
  <g transform="translate(60, 445)">
    <rect width="210" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
    <circle cx="16" cy="14" r="4" fill="#10B981"/>
    <text x="28" y="18" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">PROTOTYPE IN DEVELOPMENT</text>
  </g>

  <!-- RIGHT SIDE: TECHNICAL HARDWARE SCHEMATIC -->
  <g transform="translate(670, 70)">
    <!-- Container Card -->
    <rect width="550" height="390" rx="12" fill="#0D1216" stroke="#26333D" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="550" height="36" rx="12" fill="#141B20"/>
    <circle cx="20" cy="18" r="4" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4" fill="#10B981"/>
    <text x="75" y="22" fill="#94A3B8" font-family="monospace" font-size="11">EDGE SENSOR TEST BENCH · SCHEMATIC VIEW</text>

    <!-- Electric Motor Body Representation -->
    <g transform="translate(40, 80)">
      <!-- Motor Shaft -->
      <rect x="0" y="110" width="40" height="30" rx="4" fill="#64748B" stroke="#475569"/>
      <!-- Motor Front Face -->
      <ellipse cx="60" cy="125" rx="20" ry="85" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <!-- Motor Cylindrical Housing -->
      <rect x="60" y="40" width="220" height="170" fill="url(#motorBody)" stroke="#334155" stroke-width="2"/>
      
      <!-- Cooling Fins on Motor -->
      <line x1="80" y1="55" x2="260" y2="55" stroke="#334155" stroke-width="3"/>
      <line x1="80" y1="85" x2="260" y2="85" stroke="#334155" stroke-width="3"/>
      <line x1="80" y1="115" x2="260" y2="115" stroke="#334155" stroke-width="3"/>
      <line x1="80" y1="145" x2="260" y2="145" stroke="#334155" stroke-width="3"/>
      <line x1="80" y1="175" x2="260" y2="175" stroke="#334155" stroke-width="3"/>

      <!-- Rear Fan Shroud -->
      <ellipse cx="280" cy="125" rx="20" ry="85" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      
      <!-- Motor Mounting Feet -->
      <rect x="75" y="210" width="45" height="25" rx="3" fill="#1E293B" stroke="#475569"/>
      <rect x="220" y="210" width="45" height="25" rx="3" fill="#1E293B" stroke="#475569"/>
      
      <!-- Motor Rating Label -->
      <text x="170" y="100" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">KIRLOSKAR 3-PHASE</text>
      <text x="170" y="115" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">5.5 kW · 1440 RPM</text>

      <!-- CLIP-ON SENSOR MODULE MOUNTED ON MOTOR -->
      <g transform="translate(130, 15)">
        <rect width="80" height="55" rx="8" fill="url(#sensorGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#waveGlow)"/>
        <!-- LED status dot -->
        <circle cx="16" cy="18" r="4" fill="#10B981"/>
        <!-- Sensor Title -->
        <text x="30" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">MV-01</text>
        <line x1="12" y1="32" x2="68" y2="32" stroke="#26333D"/>
        <!-- Pulse graphic on sensor casing -->
        <path d="M 16 42 L 28 42 L 34 35 L 42 48 L 48 38 L 54 42 L 64 42" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
        <!-- Clamp bracket -->
        <rect x="25" y="55" width="30" height="15" rx="2" fill="#334155"/>
      </g>
    </g>

    <!-- LIVE TELEMETRY TELEGRAPH PANEL ON RIGHT -->
    <g transform="translate(350, 60)">
      <rect width="180" height="300" rx="8" fill="#11161A" stroke="#1E293B"/>
      
      <text x="16" y="26" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">LIVE TELEMETRY</text>
      <circle cx="156" cy="22" r="4" fill="#10B981"/>

      <!-- Telemetry Item: Vibration -->
      <g transform="translate(16, 42)">
        <text x="0" y="12" fill="#94A3B8" font-family="sans-serif" font-size="9">Vibration RMS</text>
        <text x="0" y="28" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">0.28 g</text>
        <text x="75" y="28" fill="#10B981" font-family="monospace" font-size="9">(Nominal)</text>
        <line x1="0" y1="36" x2="148" y2="36" stroke="#1E293B"/>
      </g>

      <!-- Telemetry Item: Kurtosis -->
      <g transform="translate(16, 90)">
        <text x="0" y="12" fill="#94A3B8" font-family="sans-serif" font-size="9">Impulse Kurtosis</text>
        <text x="0" y="28" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">2.94</text>
        <text x="75" y="28" fill="#10B981" font-family="monospace" font-size="9">(Gaussian)</text>
        <line x1="0" y1="36" x2="148" y2="36" stroke="#1E293B"/>
      </g>

      <!-- Telemetry Item: Current -->
      <g transform="translate(16, 138)">
        <text x="0" y="12" fill="#94A3B8" font-family="sans-serif" font-size="9">Motor Current</text>
        <text x="0" y="28" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">6.8 A</text>
        <text x="75" y="28" fill="#10B981" font-family="monospace" font-size="9">(Balanced)</text>
        <line x1="0" y1="36" x2="148" y2="36" stroke="#1E293B"/>
      </g>

      <!-- Telemetry Item: Temp -->
      <g transform="translate(16, 186)">
        <text x="0" y="12" fill="#94A3B8" font-family="sans-serif" font-size="9">Bearing Temp</text>
        <text x="0" y="28" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">48.2 °C</text>
        <text x="75" y="28" fill="#10B981" font-family="monospace" font-size="9">(Normal)</text>
        <line x1="0" y1="36" x2="148" y2="36" stroke="#1E293B"/>
      </g>

      <!-- Anomaly Score Pill -->
      <g transform="translate(16, 240)">
        <rect width="148" height="38" rx="6" fill="#141B20" stroke="#10B981"/>
        <text x="12" y="18" fill="#94A3B8" font-family="sans-serif" font-size="8">ANOMALY INDEX</text>
        <text x="12" y="32" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">0.08 / 1.00 (HEALTHY)</text>
      </g>
    </g>
  </g>
</svg>