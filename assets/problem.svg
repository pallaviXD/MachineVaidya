<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#090B0D"/>
  <!-- Small factory silhouette -->
  <g fill="#11161A">
    <rect x="100" y="150" width="200" height="100"/>
    <rect x="140" y="130" width="30" height="20"/>
    <rect x="230" y="130" width="30" height="20"/>
    <polygon points="100,150 300,150 250,120 150,120"/>
  </g>
  <!-- Machine operating -->
  <g transform="translate(500,180)">
    <rect x="-40" y="-30" width="80" height="60" fill="#222"/>
    <circle cx="0" cy="0" r="20" fill="#444"/>
    <text x="-30" y="5" fill="#fff" font-size="12">Running</text>
  </g>
  <!-- Degradation arrow -->
  <line x1="340" y1="180" x2="460" y2="180" stroke="#ff8800" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff8800"/>
    </marker>
  </defs>
  <!-- Breakdown -->
  <g transform="translate(600,180)">
    <rect x="-40" y="-30" width="80" height="60" fill="#600"/>
    <line x1="-30" y1="-10" x2="30" y2="10" stroke="#fff" stroke-width="4"/>
    <line x1="-30" y1="10" x2="30" y2="-10" stroke="#fff" stroke-width="4"/>
    <text x="-35" y="5" fill="#fff" font-size="12">Stopped</text>
  </g>
  <!-- Lost production arrow -->
  <line x1="660" y1="180" x2="780" y2="180" stroke="#ff8800" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Lost revenue icon -->
  <g transform="translate(850,180)">
    <rect x="-40" y="-30" width="80" height="60" fill="#444"/>
    <text x="-30" y="5" fill="#fff" font-size="12">Loss</text>
  </g>
</svg>
