<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#090B0D"/>
  <!-- ESP32 board -->
  <g transform="translate(200,200)">
    <rect width="120" height="80" fill="#11161A"/>
    <text x="10" y="45" fill="#fff" font-size="14">ESP32</text>
  </g>
  <!-- Accelerometer -->
  <g transform="translate(400,150)">
    <rect width="80" height="40" fill="#222"/>
    <text x="5" y="25" fill="#fff" font-size="12">ADXL345</text>
    <line x1="120" y1="190" x2="140" y2="190" stroke="#ff8800" stroke-width="2"/>
  </g>
  <!-- Microphone -->
  <g transform="translate(400,250)">
    <rect width="80" height="40" fill="#222"/>
    <text x="5" y="25" fill="#fff" font-size="12">INMP441</text>
    <line x1="120" y1="270" x2="140" y2="270" stroke="#ff8800" stroke-width="2"/>
  </g>
  <!-- Current sensor -->
  <g transform="translate(600,200)">
    <rect width="80" height="40" fill="#222"/>
    <text x="5" y="25" fill="#fff" font-size="12">ACS712</text>
    <line x1="200" y1="220" x2="220" y2="220" stroke="#ff8800" stroke-width="2"/>
  </g>
  <!-- Temperature sensor -->
  <g transform="translate(800,200)">
    <rect width="80" height="40" fill="#222"/>
    <text x="5" y="25" fill="#fff" font-size="12">DS18B20</text>
    <line x1="300" y1="220" x2="320" y2="220" stroke="#ff8800" stroke-width="2"/>
  </g>
  <!-- Motor -->
  <g transform="translate(1000,200)">
    <rect x="-60" y="-30" width="120" height="60" fill="#444"/>
    <circle cx="0" cy="0" r="20" fill="#666"/>
    <text x="-45" y="5" fill="#fff" font-size="12">Motor</text>
  </g>
  <!-- Connections -->
  <line x1="260" y1="240" x2="400" y2="170" stroke="#ff8800" stroke-width="2"/>
  <line x1="260" y1="240" x2="400" y2="270" stroke="#ff8800" stroke-width="2"/>
  <line x1="440" y1="190" x2="600" y2="220" stroke="#ff8800" stroke-width="2"/>
  <line x1="480" y1="270" x2="600" y2="220" stroke="#ff8800" stroke-width="2"/>
  <line x1="680" y1="220" x2="940" y2="200" stroke="#ff8800" stroke-width="2"/>
</svg>
